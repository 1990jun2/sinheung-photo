<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>신흥1 현장사진</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="현장사진">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--navy:#1f3a5f;--navy2:#2c5282;--ink:#1a202c;--sub:#5a6474;--faint:#b8c0cc;--line:#d9dee6;--bg:#f3f5f8;--card:#fff;--ok:#1e7d4f;--warn:#b7791f;--warnbg:#fff7e6;--err:#c53030;--doc:#2b6cb0;--pho:#2f855a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--navy);color:#fff}
header h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:-.3px}
header .who{font-size:13px;opacity:.85}
header button{background:none;border:0;color:#fff;font-size:20px;padding:4px 6px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e2e7ee;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:block}
.fld span{display:block;font-size:13px;color:var(--sub);margin:0 0 4px 2px;font-weight:600}
.fld input,.fld select{width:100%;height:52px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:20px;font-weight:700;background:#fff}
.fld input::placeholder{color:var(--faint);font-weight:400;opacity:1}
.fld input:focus,.fld select:focus{outline:0;border-color:var(--navy2)}
.fld input.bad{border-color:var(--err)}
.preview{margin:10px 0 4px;padding:10px 12px;border-radius:10px;background:#fff;border:1px dashed var(--line);font-size:14px;color:var(--sub);min-height:44px}
.preview b{color:var(--ink)}.e{color:var(--err);font-weight:600}
h3{font-size:14px;margin:18px 0 8px 2px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h3 i{width:8px;height:8px;border-radius:50%;display:inline-block}
h3 small{font-weight:400}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}
.shot{border:0;border-radius:16px;min-height:76px;padding:10px 6px;color:#fff;font-weight:700;font-size:16px;line-height:1.25;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.shot small{font-size:11px;font-weight:500;opacity:.85}
.shot.doc{background:var(--doc)}.shot.pho{background:var(--pho);min-height:96px;font-size:19px}
.shot:active{transform:translateY(1px);filter:brightness(.92)}
.src{display:flex;gap:16px;justify-content:center;margin:14px 0 4px;font-size:14px;color:var(--sub)}
.src label{display:flex;align-items:center;gap:5px}
.btn{display:block;width:100%;height:50px;border-radius:12px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;margin-top:14px;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.warn{border-color:var(--warn);background:var(--warn);color:#fff}
.btn.sm{height:42px;margin-top:8px;font-size:15px}
.btn:disabled{opacity:.4}
.err{color:var(--err);font-weight:600;font-size:14px}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;display:none;align-items:center;gap:10px;font-size:15px;cursor:pointer;font-weight:600}
.qbar.on{display:flex}.qbar span{flex:1}.qbar .n{background:#f6c343;color:#1a202c;border-radius:20px;padding:2px 10px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;width:max-content;max-width:92%;background:rgba(26,32,44,.94);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.on{display:block}.toast.warn{background:#7b4a0e}.toast.bad{background:#8b1d1d}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar .t{flex:1;font-weight:700;font-size:18px;min-width:0}
.bar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;font-size:14px;white-space:nowrap}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin-bottom:6px}
.empty{color:var(--sub);font-size:14px;padding:6px 2px}
.note{font-size:13px;color:var(--sub);background:#fff;border-radius:10px;padding:8px 10px;margin:6px 0}
.note.w{background:var(--warnbg);color:#7b4a0e}
/* 목록 행 */
.sect{background:#fff;border-radius:14px;padding:4px 12px 8px;margin-bottom:12px;border:1px solid var(--line)}
.sect>h4{margin:10px 0 4px;font-size:16px}
.glabel{font-size:12.5px;color:var(--sub);margin:10px 0 2px;font-weight:700}
.rows{display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef1f5;background:#fff;cursor:pointer}
.rw:first-child{border-top:0}
.rw img,.rw .ph{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#e9edf2;flex:none;display:flex;align-items:center;justify-content:center;color:#9aa5b4}
.rw .x{flex:1;min-width:0}
.rw .nm{font-size:14px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere;line-height:1.3}
.rw .st{font-size:12px;color:var(--sub);margin-top:2px}
.rw .st.w{color:var(--warn);font-weight:600}.rw .st.f{color:var(--err);font-weight:600}
.rw .hdl{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8a94a3;touch-action:none;cursor:grab;border-radius:8px}
.rw.dragging{background:#eef4ff;box-shadow:0 4px 14px rgba(0,0,0,.15);border-radius:10px;position:relative;z-index:2}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:700;vertical-align:1px}
.tag.w{background:var(--warnbg);color:#7b4a0e}.tag.t{background:#edf2f7;color:var(--sub)}
.dockbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;gap:8px}
.dockbar.on{display:flex}.dockbar .btn{margin:0;flex:1}
/* 슬롯 그리드(파일 보기) */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border-radius:10px;border:1px solid var(--line);background:#fff;overflow:hidden;cursor:pointer;padding:0;text-align:left}
.slot .im{aspect-ratio:4/3;background:#e9edf2 center/cover no-repeat}
.slot .nm{font-size:12px;font-weight:700;padding:4px 6px 0}.slot .mt{font-size:10.5px;color:var(--sub);padding:0 6px 5px}
.slot.empty{border-style:dashed;background:transparent;cursor:default}
.slot.empty .im{background:transparent;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
/* 모달 */
.modal{position:fixed;inset:0;z-index:52;background:rgba(10,15,25,.55);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal.center{align-items:center;padding:16px}
.panel{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal.center .panel{border-radius:18px;padding-bottom:16px}
.panel h2{font-size:18px;margin:0 0 10px}
.panel .big{width:100%;max-height:46vh;object-fit:contain;background:#111;border-radius:10px;display:block;cursor:zoom-in}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts .btn{margin:0}
.target{font-size:22px;font-weight:800;text-align:center;padding:14px 8px;background:var(--bg);border-radius:12px;margin:6px 0 4px;word-break:keep-all}
.dlg p{margin:6px 0;font-size:15px}
.dlg ul{margin:6px 0;padding-left:18px;font-size:14px}
/* 키패드 */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pad button{height:58px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer;position:relative;line-height:1}
.pad button small{display:block;font-size:10px;font-weight:600;color:var(--sub);margin-top:3px}
.pad button.used{background:#edf0f4;color:#a0a8b4;border-color:#e2e6ec}
.pad button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.pad button.sel small{color:#dfe7f3}
.pad button.used.sel{background:var(--warn);border-color:var(--warn);color:#fff}
.padimg{width:100%;height:30vh;object-fit:contain;background:#111;border-radius:10px;display:block}
.fname{font-size:17px;font-weight:800;text-align:center;margin:10px 0 0;word-break:break-all}
/* 가져오기 */
.imp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;user-select:none;-webkit-user-select:none}
.imp .c{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#ddd;border:3px solid transparent;-webkit-touch-callout:none}
.imp .c img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-touch-callout:none}
.imp .c.on{border-color:var(--navy2)}
.imp .c .b{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.imp .c.on .b{background:var(--navy2);color:#fff}
.imp.mode .c:not(.on){opacity:.75}
/* 전체화면 보기 */
.vw{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;color:#fff}
.vw.on{display:flex}
.vw .top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:rgba(0,0,0,.6)}
.vw .top .t{flex:1;min-width:0;font-size:14px;font-weight:700;word-break:break-all}
.vw .top .c{font-size:13px;opacity:.8;white-space:nowrap}
.vw .top button{background:#2d333b;border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
.vw .stage{flex:1;overflow:hidden;position:relative;touch-action:none;display:flex;align-items:center;justify-content:center}
.vw .stage img{max-width:100%;max-height:100%;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vw .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;width:40px;height:64px;border-radius:10px;font-size:24px;cursor:pointer}
.vw .nav.l{left:6px}.vw .nav.r{right:6px}
.vw .bot{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6)}
.vw .bot button{flex:1;height:48px;border:0;border-radius:10px;background:#2d333b;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.vw .bot button.d{background:#5c1f1f}
.vw .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.6;pointer-events:none}
/* 회전·자르기 */
.ed{position:fixed;inset:0;z-index:55;background:#0d1117;display:none;flex-direction:column}
.ed.on{display:flex}
.ed .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;padding:12px}
.ed canvas{touch-action:none;max-width:100%;max-height:100%}
.ed .tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#161b22}
.ed .tools button{height:52px;border:0;border-radius:10px;background:#2d333b;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.ed .tools .save{background:#2f855a}
.ed .hint{color:#aab;font-size:12px;text-align:center;padding:6px}
.busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-weight:700;color:var(--navy);text-align:center;padding:20px}
.busy.on{display:flex}
.login p{color:var(--sub);font-size:14px}
.ver{font-size:12px;color:var(--sub);text-align:center;margin-top:20px}
</style>
</head>
<body>
<header>
  <h1>신흥1구역 현장사진</h1>
  <span class="who" id="who"></span>
  <button id="btnSet" aria-label="설정" hidden>⚙︎</button>
</header>

<main>
  <!-- 접속 -->
  <section id="vLogin" class="view login">
    <h2>접속</h2>
    <p>관리자에게 받은 접속코드를 입력하세요.</p>
    <label class="fld" id="apiWrap"><span>서버 주소</span><input id="inApi" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" style="font-size:13px;font-weight:500"></label>
    <label class="fld" style="margin-top:10px"><span>접속코드</span><input id="inCode" placeholder="예: A1B2-C3D4" autocapitalize="characters" autocomplete="off"></label>
    <button class="btn primary" id="btnLogin">시작</button>
    <p class="err" id="loginMsg"></p>
  </section>

  <!-- 촬영 -->
  <section id="vMain" class="view">
    <div class="seg" id="seg"><button data-g="토건" class="on">토지건물</button><button data-g="구분">구분건물</button></div>
    <div class="two">
      <label class="fld"><span>지번</span><input id="inJibun" placeholder="예) 4902" autocomplete="off" inputmode="numeric" enterkeyhint="next"></label>
      <label class="fld"><span id="lblLoc">층 / 호</span><input id="inLoc" placeholder="예) 2층" autocomplete="off" enterkeyhint="done"></label>
    </div>
    <div class="preview" id="preview"></div>

    <h3><i style="background:var(--doc)"></i>관련서류 <small>→ 03. 서류</small></h3>
    <div class="grid g2">
      <button class="shot doc" data-kind="주민등록등본">주민등록등본</button>
      <button class="shot doc" data-kind="주민등록초본">주민등록초본</button>
      <button class="shot doc" data-kind="외국인거소증명서">외국인거소증명서</button>
      <button class="shot doc" data-kind="임대차계약서">임대차계약서</button>
    </div>
    <h3><i style="background:var(--pho)"></i>현장사진 <small>→ 02. 사진 · 슬롯 번호 지정</small></h3>
    <div class="grid g2">
      <button class="shot pho" data-kind="외관">외관<small>보통 1번</small></button>
      <button class="shot pho" data-kind="내부">내부<small id="inHint">층별 1장</small></button>
    </div>
    <div class="src">
      <label><input type="radio" name="src" value="camera" checked> 카메라로 촬영</label>
      <label><input type="radio" name="src" value="album"> 앨범에서 선택</label>
    </div>
    <button class="btn" id="btnFiles">이 지번 업로드된 파일 보기 · 수정</button>
  </section>

  <!-- 대기목록 -->
  <section id="vQueue" class="view">
    <div class="bar"><button data-back>← 촬영</button><div class="t" id="qTitle">업로드 대기목록</div><button id="btnBin">제거함</button></div>
    <div id="qNote"></div>
    <div id="qBody"></div>
  </section>

  <!-- 앨범 가져오기 (서류 여러 장) -->
  <section id="vImport" class="view">
    <div class="bar"><div class="t" id="impTitle"></div></div>
    <div class="note" id="impHint"></div>
    <div class="imp" id="impGrid"></div>
  </section>

  <!-- 업로드된 파일 -->
  <section id="vFiles" class="view">
    <div class="bar"><button data-back>← 촬영</button><div class="t" id="filesTitle"></div><button id="btnReload">새로고침</button></div>
    <label class="chk"><input type="checkbox" id="onlyLoc"> <span id="onlyLocTxt">이 층/호 서류만 보기</span></label>
    <div id="fileBody"></div>
  </section>
</main>

<div class="qbar" id="qbar"><span>업로드 대기 <b class="n" id="qcount">0</b> 건 · 눌러서 확인 후 업로드</span><b>›</b></div>
<div class="dockbar" id="dock"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="panel" id="panel"></div></div>
<div class="vw" id="vw">
  <div class="top"><div class="t" id="vwName"></div><span class="c" id="vwCount"></span><button id="vwClose">닫기</button></div>
  <div class="stage" id="vwStage"><img id="vwImg" alt=""><button class="nav l" id="vwPrev">‹</button><button class="nav r" id="vwNext">›</button><div class="hint">두 손가락·두 번 탭으로 확대 · 좌우로 넘기기</div></div>
  <div class="bot" id="vwBot"></div>
</div>
<div class="ed" id="ed">
  <div class="hint">모서리를 끌어 자르고, 가운데를 끌어 옮깁니다</div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="tools">
    <button id="edL">⟲ 왼쪽</button><button id="edR">⟳ 오른쪽</button><button id="edReset">원래대로</button>
    <button id="edCancel">취소</button><button class="save" id="edSave">저장</button>
  </div>
</div>
<div class="busy" id="busy">처리 중…</div>
<input type="file" id="picker" accept="image/*" hidden>

<script>
'use strict';
/* ===== 관리자 설정: Apps Script 웹앱 주소를 넣으면 근무자는 코드만 입력합니다 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyzlgE2Ie1B0ubWHnsld8vQhjEAhP0Uun5Pa6_wMpszWGBpTreCho3wJNsOq8TTfncK9Q/exec';
const VERSION = '1.1.3';
const MAX_EDGE = 3200, JPEG_Q = 0.92;   // 고화질 저장 기준
const DONG = '신흥동';
const DOC_KINDS = ['주민등록등본', '주민등록초본', '외국인거소증명서', '임대차계약서'];
const PHOTO_KINDS = ['외관', '내부'];
const SLOTS = 12;
const BIN_DAYS = 7;

/* ---------- 작은 도구 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('sh1.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sh1.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('sh1.' + k); } catch (e) {} },
};
const S = {
  api: API_URL || LS.get('api', ''), code: LS.get('code', ''), name: LS.get('name', ''), gubun: LS.get('gubun', '토건'),
  committed: '', needShotConfirm: false,
  peek: { docs: {}, photos: {} }, peekOk: false,
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ---------- 입력 정리 (서버 Code.gs와 같은 규칙) ---------- */
function normJibun(s) {
  const v = String(s || '').replace(/\s+/g, '').replace(/^신흥동?/, '').replace(/번지$/, '');
  if (!/^\d{1,5}(-\d{1,4})?$/.test(v)) throw new Error('지번 형식 확인 (예: 4902, 4677-1)');
  return v;
}
function normLoc(s, gubun) {
  const v = String(s || '').replace(/\s+/g, '').toUpperCase();
  if (!v) return '';
  const pad = n => (n.length < 2 ? '0' + n : n);
  let m;
  if (gubun === '구분') {
    if ((m = v.match(/^(?:B|비)(\d{1,2})호?$/))) return 'B' + pad(m[1]) + '호';
    if ((m = v.match(/^(\d{2,4})호?$/))) return m[1] + '호';
    throw new Error('호 형식 확인 (예: 101, 101호, B01호)');
  }
  if ((m = v.match(/^(\d{1,2})(?:층|F)?$/))) return Number(m[1]) + '층';
  if ((m = v.match(/^(?:B|지하)(\d)(?:층|F)?$/))) return '지하' + m[1] + '층';
  if (/^(?:지층|지하|지하층|B)$/.test(v)) return '지층';
  if (v === '반지하') return '반지하';
  if (/^옥탑/.test(v)) return /무허가/.test(v) ? '옥탑(무허가)' : '옥탑';
  if ((m = v.match(/^비(\d{1,2})호?$/))) return '비' + pad(m[1]) + '호';
  if ((m = v.match(/^(\d{3,4})호$/))) return m[1] + '호';
  throw new Error('층/호 형식 확인 (예: 1층, 지층, 옥탑, 비01호, 201호)');
}
const photoKey = (gubun, jibun, loc) => (gubun === '구분' ? jibun + '_' + loc.replace(/호$/, '') : jibun);
/** 저장 대상. 문제가 있으면 오류 */
function makeTarget(kind, src) {
  src = src || { gubun: S.gubun, jibun: $('inJibun').value, loc: $('inLoc').value };
  const gubun = src.gubun === '구분' ? '구분' : '토건';
  const jibun = normJibun(src.jibun);
  const loc = normLoc(src.loc, gubun);
  const isDoc = isDocKind(kind);
  if (!loc && gubun === '구분') throw new Error('구분건물은 호를 입력하세요');
  if (!loc && isDoc) throw new Error('서류는 층 또는 호를 입력하세요');
  return { gubun, jibun, loc, kind, isDoc, key: photoKey(gubun, jibun, loc) };
}
/** 세대(지번+층/호) 식별자와 표시 */
const segKey = t => `${t.gubun}|${t.jibun}|${t.loc}`;
const segLabel = t => `${DONG} ${t.jibun}${t.loc ? ' ' + t.loc : ''}${t.gubun === '구분' ? ' (구분)' : ''}`;
function readSeg() {
  const gubun = S.gubun;

  if (gubun === '구분' && !loc) throw new Error('구분건물은 호를 입력하세요');
  return { gubun, jibun, loc };
}

/* ---------- 서버 통신 ---------- */
class NetError extends Error {}
class AuthError extends Error {}
async function api(action, body, timeoutMs) {
  if (!S.api) throw new AuthError('서버 주소가 없습니다');
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), timeoutMs || 90000);
  let res;
  try {
    // 단순 요청(text/plain)으로 보내 CORS 사전요청을 피함
    res = await fetch(S.api, { method: 'POST', body: JSON.stringify(Object.assign({ action, code: S.code }, body || {})), signal: ctl.signal, redirect: 'follow' });
  } catch (e) {
    throw new NetError('연결 안 됨');
  } finally { clearTimeout(tm); }
  if (!res.ok) throw new NetError('서버 응답 ' + res.status);
  let j;
  try { j = await res.json(); } catch (e) { throw new NetError('서버 응답을 읽지 못함'); }
  if (j.auth === false) throw new AuthError(j.error || '접속코드 오류');
  if (!j.ok) throw new Error(j.error || '서버 오류');
  return j;
}

/* ---------- 이미지 ---------- */
function loadImg(src) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error('사진을 읽지 못했습니다')); im.src = src; });
}
async function toJpeg(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);   // 최신 브라우저는 사진의 회전정보(EXIF)를 자동 반영
    const s = Math.min(1, MAX_EDGE / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * s); cv.height = Math.round(im.naturalHeight * s);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', JPEG_Q));
  } finally { URL.revokeObjectURL(url); }
}
const blobToB64 = b => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = bad; r.readAsDataURL(b); });
const canvasToB64 = cv => new Promise(r => cv.toBlob(b => r(blobToB64(b)), 'image/jpeg', JPEG_Q));

/* ---------- 폰 안 저장소: 대기목록(q)과 제거함(bin) ---------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, bad) => {
      const rq = indexedDB.open('sh1-queue', 2);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains('q')) d.createObjectStore('q', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('bin')) d.createObjectStore('bin', { keyPath: 'id' });
      };
      rq.onsuccess = () => ok((this.db = rq.result));
      rq.onerror = () => bad(rq.error);
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((ok, bad) => { const t = db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => ok(r && r.result); t.onerror = () => bad(t.error); });
  },
  put(store, x) { return this.tx(store, 'readwrite', s => s.put(x)); },
  del(store, id) { return this.tx(store, 'readwrite', s => s.delete(id)); },
  get(store, id) { return this.tx(store, 'readonly', s => s.get(id)); },
  async all(store) { return ((await this.tx(store, 'readonly', s => s.getAll())) || []).sort((a, b) => (a.order || a.at) - (b.order || b.at)); },
};
const Q = { dirty: false };
async function addToQueue(t, blob, extra) {
  const now = Date.now();
  const it = Object.assign({ id: uid(), gubun: t.gubun, jibun: t.jibun, loc: t.loc, kind: t.kind, blob, at: now, order: now, status: 'wait' }, extra || {});
  await DB.put('q', it);
  updateBar();
  return it;
}
async function toBin(it) {
  const x = Object.assign({}, it, { removedAt: Date.now(), status: 'wait', error: '' });
  await DB.put('bin', x);
  await DB.del('q', it.id);
}
async function purgeBin() {
  const lim = Date.now() - BIN_DAYS * 864e5;
  for (const x of await DB.all('bin')) if ((x.removedAt || 0) < lim) await DB.del('bin', x.id);
}
async function updateBar() {

/** 슬롯 고르기. 결과 {slot, review} 또는 null(취소) */
function slotPad({ t, blob, imgUrl, current, excludeId, fresh, title }) {

      $('padSave').disabled = !sel;
    };
    openPanel(`<h2>${esc(title || (t.kind + ' 사진 슬롯 지정'))}</h2>
      ${url ? `<img class="padimg" id="padImg" src="${url}" alt="">` : ''}
      <div style="font-size:13px;color:var(--sub);margin-top:8px;text-align:center">${esc(segLabel(t))} · ${esc(t.kind)}</div>
      <div class="fname" id="padName"></div>

      <div class="acts"><button class="btn" id="padCancel">취소</button><button class="btn primary" id="padSave" disabled>저장</button></div>`,
      { onClose: () => { if (!imgUrl && url) URL.revokeObjectURL(url); } });

/* ---------- 대기목록 ---------- */
async function fetchPeek(items) {
  const docs = {}, keys = {};
  items.forEach(it => { if (isDocKind(it.kind)) docs[docGk(it)] = { gubun: it.gubun, jibun: it.jibun, loc: it.loc, kind: it.kind }; else keys[photoKey(it.gubun, it.jibun, it.loc)] = 1; });
  try {
    const r = await api('peek', { docs: Object.values(docs), keys: Object.keys(keys) }, 10000);
    Object.assign(S.peek.docs, r.docs); Object.assign(S.peek.photos, r.photos); S.peekOk = true;
  } catch (e) { if (e instanceof AuthError) throw e; S.peekOk = false; }
}
/** 대기 항목별 예상 파일명 */
function planNames(items) {
  const res = {}, groups = {};
  items.filter(x => isDocKind(x.kind)).forEach(x => (groups[docGk(x)] = groups[docGk(x)] || []).push(x));
  Object.keys(groups).forEach(gk => {
    const known = S.peekOk && S.peek.docs[gk] !== undefined;
    const base = known ? S.peek.docs[gk] : 0;
    groups[gk].sort((a, b) => a.order - b.order).forEach((x, i) => (res[x.id] = { name: docName(x.jibun, x.loc, x.kind, base + i + 1), tentative: !known, base }));
  });
  items.filter(x => !isDocKind(x.kind)).forEach(x => {
    const key = photoKey(x.gubun, x.jibun, x.loc);
    if (!x.slot) { res[x.id] = { name: `${key}-사-?.jpg`, warn: '슬롯 미지정 — 정보 수정에서 지정하세요' }; return; }
    const qd = items.some(y => y !== x && !isDocKind(y.kind) && photoKey(y.gubun, y.jibun, y.loc) === key && y.slot === x.slot && !y.review);
    const dd = (S.peek.photos[key] || []).includes(x.slot);
    res[x.id] = { name: photoName(key, x.slot, x.review), warn: (!x.review && (dd || qd)) ? `슬롯 ${x.slot} 중복 — 업로드 때 확인합니다` : (x.review ? '중복 슬롯 → (검토)로 저장 예정' : ''), tentative: !S.peekOk };
  });
  return res;
}
/** 화면에 보이는 순서대로 정렬된 묶음 */
function arrange(items) {
  const segs = [];
  const byKey = {};
  items.slice().sort((a, b) => a.at - b.at).forEach(x => { const k = segKey(x); if (!byKey[k]) { byKey[k] = { seg: x, docs: {}, photos: [] }; segs.push(byKey[k]); } });
  items.forEach(x => { const s = byKey[segKey(x)]; if (isDocKind(x.kind)) (s.docs[x.kind] = s.docs[x.kind] || []).push(x); else s.photos.push(x); });
  segs.forEach(s => { Object.values(s.docs).forEach(g => g.sort((a, b) => a.order - b.order)); s.photos.sort((a, b) => (a.slot || 99) - (b.slot || 99) || a.at - b.at); });
  const flat = [];
  segs.forEach(s => { DOC_KINDS.forEach(k => (s.docs[k] || []).forEach(x => flat.push(x))); s.photos.forEach(x => flat.push(x)); });
  return { segs, flat };
}

/** ≡ 손잡이로 같은 묶음 안에서 끌어서 옮기기 */
function enableDrag(root, onChange) {
  root.querySelectorAll('.hdl').forEach(h => h.addEventListener('pointerdown', e => {
    const row = h.closest('.rw'), grp = row.parentElement;
    e.preventDefault(); e.stopPropagation();
    try { h.setPointerCapture(e.pointerId); } catch (x) {}
    row.classList.add('dragging');
    let moved = false;
    const move = ev => {
      const y = ev.clientY;
      const sibs = [...grp.children];
      const i = sibs.indexOf(row), prev = sibs[i - 1], next = sibs[i + 1];
      if (next) { const r = next.getBoundingClientRect(); if (y > r.top + r.height / 2) { grp.insertBefore(next, row); moved = true; onChange(grp); return; } }
      if (prev) { const r = prev.getBoundingClientRect(); if (y < r.top + r.height / 2) { grp.insertBefore(prev, row.nextSibling); moved = true; onChange(grp); } }  // 끄는 행 자체는 옮기지 않아야 손가락 추적이 유지됨
    };
    const up = () => { row.classList.remove('dragging'); h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  }));
}

      <div class="two" style="margin-top:10px"><label class="fld"><span>지번</span><input id="mJ" inputmode="numeric"></label><label class="fld"><span>층 / 호</span><input id="mL"></label></div>
      <div id="mSlotWrap"><div class="glabel" style="margin-top:12px">슬롯 번호</div><div class="pad" id="mPad"></div></div>
      <div class="preview" id="mP"></div>

    modalResolve = resolve;
    $('mG').value = cur.gubun || '토건'; $('mK').value = cur.kind; $('mJ').value = cur.jibun || ''; $('mL').value = cur.loc || '';
    let slot = cur.slot || 0, used = { q: [], drive: null }, usedKey = '';
    const val = () => makeTarget($('mK').value, { gubun: $('mG').value, jibun: $('mJ').value, loc: $('mL').value });
    const isUsed = n => used.q.includes(n) || (used.drive || []).includes(n);
    const refreshUsed = async t => {
      if (!t || t.isDoc || t.key === usedKey) return;
      usedKey = t.key;
      try { used = await usedSlots(t.key, opt.excludeId); } catch (e) { used = { q: [], drive: null }; }
      if (opt.selfKey === t.key && opt.selfSlot) { used.drive = (used.drive || []).filter(n => n !== opt.selfSlot); }
      pv();
    };
    const pv = () => {
      let t = null;

      $('mPad').querySelectorAll('button').forEach(b => b.onclick = () => { slot = +b.dataset.n; pv(); });

      else $('mP').innerHTML = '새 이름: <b>' + esc(`${DONG} ${t.jibun} ${t.loc} ${t.kind}`) + 'N.jpg</b> <small>(그 묶음의 마지막 번호 다음)</small>';
    };

    $('mSave').onclick = async () => {
      let t; try { t = val(); } catch (e) { return; }
      let review = false;
      if (!t.isDoc) {

          if (!(await askInline(`슬롯 ${slot}번이 중복되었습니다.<br>그래도 저장하면 <b>(검토)</b> 이름으로 저장됩니다.`, '검토로 저장', '다시 선택'))) return;

  if (!items.length) return;
  const { segs, flat } = arrange(items);
  const summary = segs.map(s => { const d = Object.values(s.docs).reduce((a, g) => a + g.length, 0); return `<li><b>${esc(segLabel(s.seg))}</b> — 서류 ${d}장, 사진 ${s.photos.length}장</li>`; }).join('');
  if (!(await ask({ title: '업로드 전 확인', html: `<p style="font-size:17px;font-weight:700">지번과 층·호 정보를 확인하세요</p><ul>${summary}</ul>`, buttons: [{ label: '취소', value: false }, { label: '업로드', value: true, cls: 'go' }] }))) return;
  if (!navigator.onLine) { toast('✗ 인터넷에 연결되지 않았습니다', 'bad'); return; }
  const saved = [];
  let fail = 0, held = 0, stop = false, n = 0;
  const total = flat.length;
  const send = (it, extra) => api('upload', Object.assign({ gubun: it.gubun, jibun: it.jibun, loc: it.loc, kind: it.kind, cid: it.id }, extra), 120000);
  try {
    for (const s of segs) {
      if (stop) break;
      // 서류: 묶음 순서대로. 하나 실패하면 그 묶음의 나머지는 멈춤
      for (const k of DOC_KINDS) {
        const g = s.docs[k] || [];
        for (let i = 0; i < g.length && !stop; i++) {
          const it = g[i];
          busy(true, `업로드 중… ${++n} / ${total}`);
          try {
            const r = await send(it, { data: await blobToB64(it.blob) });
            await DB.del('q', it.id); saved.push(r.name);
          } catch (e) {
            if (e instanceof AuthError) throw e;
            if (e instanceof NetError) { stop = true; break; }
            it.status = 'fail'; it.error = e.message; await DB.put('q', it); fail++;
            held += g.length - i - 1; n += g.length - i - 1;
            break;
          }
        }
      }
      // 사진: 슬롯 지정. 드라이브와 중복이면 선택
      for (const it of s.photos) {
        if (stop) break;
        busy(true, `업로드 중… ${++n} / ${total}`);
        if (!it.slot) { held++; continue; }
        let force = !!it.review, done = false;
        while (!done) {
          let r;
          try { r = await send(it, { slot: it.slot, force, data: await blobToB64(it.blob) }); }
          catch (e) {
            if (e instanceof AuthError) throw e;
            if (e instanceof NetError) { stop = true; break; }
            it.status = 'fail'; it.error = e.message; await DB.put('q', it); fail++; break;
          }
          if (!r.dup) { await DB.del('q', it.id); saved.push(r.name); done = true; break; }
          busy(false);
          const key = photoKey(it.gubun, it.jibun, it.loc);
          const c = await ask({ title: '슬롯 중복', html: `<img class="padimg" src="${thumbUrl(it)}" alt="" style="height:24vh"><p>드라이브에 이미 <b>${esc(key)}-사-${it.slot}</b>이(가) 있습니다.</p>`,
            buttons: [{ label: '건너뛰기', value: 'skip' }, { label: '슬롯 다시 지정', value: 'slot' }, { label: '검토로 저장', value: 'review', cls: 'warn' }] });
          if (c === 'review') { force = true; it.review = true; await DB.put('q', it); }
          else if (c === 'slot') {
            const t = makeTarget(it.kind, it);
            const p = await slotPad({ t, imgUrl: thumbUrl(it), current: it.slot, excludeId: it.id, title: '슬롯 다시 지정' });
            if (!p) { held++; break; }
            it.slot = p.slot; it.review = p.review; force = p.review; await DB.put('q', it);
          } else { held++; break; }
          busy(true, `업로드 중… ${n} / ${total}`);
        }
      }
    }
  } catch (e) { busy(false); return logout(e.message); }
  busy(false);
  const left = (await DB.all('q')).length;
  await ask({ title: left ? '업로드 일부 완료' : '업로드 완료', html:
    `<p>저장 <b>${saved.length}건</b>${left ? ` · 남음 <b>${left}건</b>` : ''}</p>` +
    (stop ? '<p class="note w">인터넷 연결이 끊겨 멈췄습니다. 연결 후 다시 [전체 업로드]를 누르세요.</p>' : '') +
    (fail ? `<p class="note w">실패 ${fail}건${held ? `, 같은 묶음에서 멈춘 ${held}건` : ''}은 대기목록에 남아 있습니다.</p>` : (held ? `<p class="note">건너뛴 ${held}건은 대기목록에 남아 있습니다.</p>` : '')) +
    (saved.length ? `<ul style="max-height:30vh;overflow:auto">${saved.slice(0, 40).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''),
    buttons: [{ label: '확인', value: true, cls: 'primary' }] });
  updateBar();
  if (left) openQueue(); else show('vMain');
}

/* ---------- 전체화면 보기 (확대·좌우 넘기기) ---------- */
const V = { list: [], i: 0, mode: '', s: 1, x: 0, y: 0, ptrs: new Map(), start: null, lastTap: 0, swipe: null };
function openViewer(list, i, mode) {
  V.list = list; V.i = Math.max(0, Math.min(i, list.length - 1)); V.mode = mode;
  $('vw').style.zIndex = modalOpen() ? 58 : 50;
  $('vw').classList.add('on');
  vwShow();
}
function vwClose() { $('vw').classList.remove('on'); $('vwImg').src = ''; }
function vwShow() {
  const it = V.list[V.i];
  if (!it) { vwClose(); return; }
  V.s = 1; V.x = 0; V.y = 0; vwApply();
  $('vwImg').src = it.url;
  $('vwName').textContent = it.name || '';
  $('vwCount').textContent = V.list.length > 1 ? `${V.i + 1} / ${V.list.length}` : '';
  $('vwPrev').style.display = V.i > 0 ? '' : 'none';
  $('vwNext').style.display = V.i < V.list.length - 1 ? '' : 'none';
  const bot = $('vwBot');
  if (V.mode === 'queue') {
    const qit = QV.flat.find(x => x.id === it.id);
    bot.innerHTML = `<button id="vwEdit">정보 수정</button>${qit && isDocKind(qit.kind) ? '<button id="vwOrder">순서 바꾸기</button>' : ''}<button class="d" id="vwDel">제거</button>`;
    bot.style.display = '';
    $('vwEdit').onclick = async () => { if (await editQueueItem(it.id)) { await renderQueue(); vwRefreshQueue(it.id); } };
    if ($('vwOrder')) $('vwOrder').onclick = () => { vwClose(); toast('목록에서 오른쪽 ≡ 를 끌어 순서를 바꾼 뒤 [변경완료]를 누르세요'); };
    $('vwDel').onclick = async () => { if (await removeQueueItem(it.id)) { await renderQueue(); vwRefreshQueue(null); } };
  } else { bot.innerHTML = ''; bot.style.display = 'none'; }
}
function vwRefreshQueue(keepId) {
  const list = QV.flat.map(x => ({ url: thumbUrl(x), name: (QV.names[x.id] || {}).name, id: x.id }));
  if (!list.length) { vwClose(); return; }
  let i = keepId ? list.findIndex(x => x.id === keepId) : V.i;
  if (i < 0) i = V.i;
  V.list = list; V.i = Math.min(i, list.length - 1); vwShow();
}
function vwApply() { $('vwImg').style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`; }
function vwGo(d) { const j = V.i + d; if (j >= 0 && j < V.list.length) { V.i = j; vwShow(); } }
$('vwClose').onclick = vwClose;
$('vwPrev').onclick = e => { e.stopPropagation(); vwGo(-1); };
$('vwNext').onclick = e => { e.stopPropagation(); vwGo(1); };
document.addEventListener('keydown', e => { if (!$('vw').classList.contains('on')) return; if (e.key === 'ArrowLeft') vwGo(-1); if (e.key === 'ArrowRight') vwGo(1); if (e.key === 'Escape') vwClose(); });
(function () {
  const st = $('vwStage'), img = $('vwImg');
  // 확대 기준점 계산용: 이미지 원래 위치(변형 전)
  const base = () => { const r = st.getBoundingClientRect(); const w = img.offsetWidth, h = img.offsetHeight; return { l: r.left + (r.width - w) / 2, t: r.top + (r.height - h) / 2, w, h }; };
  const zoomAt = (ns, cx, cy) => {
    ns = Math.max(1, Math.min(5, ns));
    const b = base();
    const px = cx - b.l, py = cy - b.t;            // 화면 좌표 → 이미지 기준
    V.x = px - (px - V.x) * (ns / V.s); V.y = py - (py - V.y) * (ns / V.s); V.s = ns;
    if (V.s === 1) { V.x = 0; V.y = 0; }
    vwApply();
  };
  st.addEventListener('pointerdown', e => {
    if (e.target.closest('.nav')) return;
    st.setPointerCapture(e.pointerId);
    V.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (V.ptrs.size === 2) {
      const [a, b] = [...V.ptrs.values()];
      V.start = { d: Math.hypot(a.x - b.x, a.y - b.y), s: V.s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
      V.swipe = null;
    } else if (V.ptrs.size === 1) {
      V.swipe = { x: e.clientX, y: e.clientY, ox: V.x, oy: V.y, t: Date.now() };
    }
  });
  st.addEventListener('pointermove', e => {
    if (!V.ptrs.has(e.pointerId)) return;
    V.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (V.ptrs.size === 2 && V.start) {
      const [a, b] = [...V.ptrs.values()];
      zoomAt(V.start.s * Math.hypot(a.x - b.x, a.y - b.y) / V.start.d, V.start.cx, V.start.cy);
      V.start.s = V.s; V.start.d = Math.hypot(a.x - b.x, a.y - b.y);
    } else if (V.ptrs.size === 1 && V.swipe && V.s > 1) {
      V.x = V.swipe.ox + (e.clientX - V.swipe.x); V.y = V.swipe.oy + (e.clientY - V.swipe.y); vwApply();
    }
  });
  const end = e => {
    if (!V.ptrs.has(e.pointerId)) return;
    V.ptrs.delete(e.pointerId);
    if (V.ptrs.size < 2) V.start = null;
    if (V.ptrs.size === 0 && V.swipe) {
      const dx = e.clientX - V.swipe.x, dy = e.clientY - V.swipe.y;
      if (V.s === 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) vwGo(dx < 0 ? 1 : -1);
      else if (Math.hypot(dx, dy) < 10 && Date.now() - V.swipe.t < 300) {
        const now = Date.now();
        if (now - V.lastTap < 320) { zoomAt(V.s > 1 ? 1 : 2.5, e.clientX, e.clientY); V.lastTap = 0; }
        else V.lastTap = now;
      }
      V.swipe = null;
    }
  };
  st.addEventListener('pointerup', end);
  st.addEventListener('pointercancel', end);
  st.addEventListener('wheel', e => { e.preventDefault(); zoomAt(V.s * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
})();

/* ---------- 업로드된 파일 보기 / 수정 ---------- */
const F = { data: null, target: null, dirty: false };
$('btnFiles').onclick = () => {
  try { readSeg(); } catch (e) { toast('✗ 지번과 층·호를 먼저 입력하세요', 'bad'); return; }
  F.dirty = false;
  show('vFiles'); loadFiles();
};
$('btnReload').onclick = () => { F.dirty = false; loadFiles(); };
$('onlyLoc').onchange = () => { LS.set('onlyLoc', $('onlyLoc').checked); loadFiles(); };
async function loadFiles(quiet) {
  let seg; try { seg = readSeg(); } catch (e) { toast('✗ ' + esc(e.message), 'bad'); return; }
  F.target = seg;
  $('filesTitle').textContent = segLabel(seg);
  if (!quiet) $('fileBody').innerHTML = '<p class="empty">불러오는 중…</p>';
  try {
    F.data = await api('list', { gubun: seg.gubun, jibun: seg.jibun, loc: seg.loc, onlyLoc: $('onlyLoc').checked });
    F.dirty = false;
    renderFiles();
  } catch (e) {
    if (e instanceof AuthError) return logout(e.message);
    $('fileBody').innerHTML = `<p class="err">불러오기 실패: ${esc(e.message)}</p>`;
  }
}
const DOC_RE = new RegExp(`^${DONG} (\\S+) (\\S+) (${DOC_KINDS.join('|')})(\\d+)\\.`);
function renderFiles() {
  const d = F.data;
  const groups = {}, other = [];
  d.docs.forEach(f => { const m = f.name.match(DOC_RE); if (m) { const k = m[2] + ' ' + m[3]; (groups[k] = groups[k] || []).push(f); } else other.push(f); });
  Object.values(groups).forEach(g => g.sort((a, b) => +a.name.match(DOC_RE)[4] - +b.name.match(DOC_RE)[4]));
  const meta = f => { const m = f.meta || {}; return m.at ? `${m.by || ''} · ${new Date(m.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}` : '기존 파일'; };
  const row = (f, handle) => `<div class="rw" data-id="${f.id}">${f.thumb ? `<img src="${f.thumb}" alt="">` : '<div class="ph">🖼</div>'}<div class="x"><div class="nm">${esc(f.name.replace(DONG + ' ', ''))}</div><div class="st">${esc(meta(f))}</div></div>${handle ? '<div class="hdl">≡</div>' : ''}</div>`;
  const main = d.photos.filter(p => !p.review), rev = d.photos.filter(p => p.review);
  const bySlot = {}; main.forEach(p => (bySlot[p.slot] = p));
  const slotCard = n => { const p = bySlot[n]; return p ? `<button class="slot" data-id="${p.id}"><div class="im" ${p.thumb ? `style="background-image:url('${p.thumb}')"` : ''}></div><div class="nm">사-${n}</div><div class="mt">${esc((p.meta && p.meta.kind) || '')}${p.meta && p.meta.kind === '내부' && p.meta.loc ? ' · ' + esc(p.meta.loc) : ''}</div></button>` : `<div class="slot empty"><div class="im">빈 슬롯 ${n}</div><div class="nm" style="color:var(--faint)">사-${n}</div><div class="mt">&nbsp;</div></div>`; };
  const extra = main.filter(p => p.slot > d.slots);
  $('fileBody').innerHTML =
    `<h3><i style="background:var(--doc)"></i>관련서류 ${d.docs.length}건 <small>${esc(d.folder ? '03. 서류 / ' + d.folder : '폴더 아직 없음')}</small></h3>` +
    (d.docs.length ? '<div class="sect">' + Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true })).map(k => `<div class="glabel">${esc(k)} ${groups[k].length}장</div><div class="rows" data-group="${esc(k)}">${groups[k].map(f => row(f, groups[k].length > 1)).join('')}</div>`).join('') +
      (other.length ? `<div class="glabel">기타 파일</div><div class="rows">${other.map(f => row(f, false)).join('')}</div>` : '') + '</div>' : '<p class="empty">없음</p>') +
    `<h3><i style="background:var(--pho)"></i>현장사진 ${main.length} / ${d.slots}칸 <small>02. 사진 / ${esc(d.key)}-사-N</small></h3>` +
    `<div class="slots">${Array.from({ length: d.slots }, (_, i) => slotCard(i + 1)).join('')}${extra.map(p => slotCard(p.slot)).join('')}</div>` +
    (rev.length ? `<h3><i style="background:var(--warn)"></i>검토 필요 ${rev.length}건 <small>관리자가 드라이브에서 정리</small></h3><div class="sect"><div class="rows">${rev.map(f => row(f, false)).join('')}</div></div>` : '');
  const all = d.docs.concat(d.photos);
  $('fileBody').querySelectorAll('.rw[data-id], .slot[data-id]').forEach(c => c.addEventListener('click', e => {
    if (e.target.closest('.hdl') || F.dirty) return;

}
function filesDock() {
  if (curView !== 'vFiles') return;

  setDock('<button class="btn" id="frCancel">취소</button><button class="btn primary" id="frDone">변경완료</button>');
  $('frCancel').onclick = () => { F.dirty = false; renderFiles(); };
  $('frDone').onclick = async () => {
    if (!(await ask({ title: '순서 변경', html: '<p>바꾼 순서대로 드라이브의 파일 번호를 다시 매길까요?</p>', buttons: [{ label: '취소', value: false }, { label: '변경완료', value: true, cls: 'primary' }] }))) return;
    busy(true);
    try {
      let changed = 0;

    } catch (e) { toast('✗ 순서 변경 실패: ' + esc(e.message), 'bad'); }

}

async function doDelete(f, isPhoto) {
  if (!(await ask({ title: '삭제', html: `<p><b>${esc(f.name)}</b></p><p>드라이브 휴지통으로 이동합니다. ${isPhoto ? `슬롯 ${f.slot}번은 빈칸으로 남습니다.` : '뒤 번호가 하나씩 당겨집니다.'}</p>`, buttons: [{ label: '취소', value: false }, { label: '삭제', value: true, cls: 'danger' }] }))) return;
  busy(true);
  try { const r = await api('remove', { id: f.id }); toast(`삭제됨${r.renamed ? ` · ${r.renamed}개 번호 당김` : ''}`); await loadFiles(true); }
  catch (e) { toast('✗ 삭제 실패: ' + esc(e.message), 'bad'); }
  busy(false);
}
async function doRetake(ctx, file) {
  busy(true);
  try {
    const blob = await toJpeg(file);
    const r = await api('replace', { id: ctx.f.id, data: await blobToB64(blob) }, 120000);
    toast('✓ 다시 찍기 완료: ' + esc(r.name));
    await loadFiles(true);
  } catch (e) { toast('✗ 다시 찍기 실패: ' + esc(e.message) + (e instanceof NetError ? ' (인터넷 연결 필요)' : ''), 'bad'); }
  busy(false);
}
async function driveMove(f, isPhoto) {
  const m = f.meta || {};
  let cur = { gubun: m.gubun || F.target.gubun, jibun: m.jibun || F.target.jibun, loc: m.loc || '', kind: m.kind || (isPhoto ? '외관' : '주민등록등본'), slot: f.slot || 0 };
  const dm = f.name.match(DOC_RE);
  if (dm) cur = Object.assign(cur, { jibun: dm[1], loc: dm[2], kind: dm[3] });
  if (isPhoto && !cur.loc && F.target.gubun === '구분') cur.loc = F.target.loc;
  const r = await infoForm(cur, { imgUrl: f.thumb, selfKey: F.data.key, selfSlot: f.slot });
  if (!r) return;
  busy(true);
  try {
    let res = await api('move', { id: f.id, to: r, force: r.review });
    if (res.dup) {
      busy(false);
      if (!(await ask({ title: '슬롯 중복', html: `<p>${esc(res.name)}이(가) 이미 있습니다. (검토) 이름으로 저장할까요?</p>`, buttons: [{ label: '취소', value: false }, { label: '검토로 저장', value: true, cls: 'warn' }] }))) return;
      busy(true);
      res = await api('move', { id: f.id, to: r, force: true });
    }
    toast(res.unchanged ? '기록을 수정했습니다' : '✓ 변경됨: ' + esc(res.name));
    await loadFiles(true);
  } catch (e) { toast('✗ 수정 실패: ' + esc(e.message), 'bad'); }
  busy(false);
}

/* ---------- 회전 · 자르기 (업로드된 파일) ---------- */
const E = { img: null, rot: 0, crop: null, f: null, drag: null };
async function openEditor(f, url) {
  try { E.img = await loadImg(url); } catch (e) { toast('✗ 이 파일은 편집할 수 없는 형식입니다', 'bad'); return; }
  E.f = f; E.rot = 0; E.crop = { x: 0, y: 0, w: 1, h: 1 };
  $('ed').classList.add('on'); drawEd();
}
function edDims() { const iw = E.img.naturalWidth, ih = E.img.naturalHeight; return E.rot % 180 ? [ih, iw] : [iw, ih]; }
function drawRotated(ctx, W, H) {
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(E.rot * Math.PI / 180);
  const [w, h] = E.rot % 180 ? [H, W] : [W, H];
  ctx.drawImage(E.img, -w / 2, -h / 2, w, h); ctx.restore();
}
function drawEd() {
  const cv = $('cv'), st = $('stage');
  const [W, H] = edDims();
  const s = Math.min((st.clientWidth - 24) / W, (st.clientHeight - 24) / H, 1);
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(W * s), ch = Math.round(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  E.cw = cw; E.ch = ch;
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawRotated(c, cw, ch);
  const r = E.crop, x = r.x * cw, y = r.y * ch, w = r.w * cw, h = r.h * ch;
  c.fillStyle = 'rgba(0,0,0,.55)';
  c.fillRect(0, 0, cw, y); c.fillRect(0, y + h, cw, ch - y - h); c.fillRect(0, y, x, h); c.fillRect(x + w, y, cw - x - w, h);
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(x, y, w, h);
  c.fillStyle = '#fff';
  [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(([px, py]) => c.fillRect(px - 7, py - 7, 14, 14));
}
function edPt(e) { const b = $('cv').getBoundingClientRect(); return { x: (e.clientX - b.left) / E.cw, y: (e.clientY - b.top) / E.ch }; }
$('cv').addEventListener('pointerdown', e => {
  const p = edPt(e), r = E.crop, tx = 24 / E.cw, ty = 24 / E.ch;
  const near = (a, b, t) => Math.abs(a - b) < t;
  let mode = null;
  if (near(p.x, r.x, tx) && near(p.y, r.y, ty)) mode = 'tl';
  else if (near(p.x, r.x + r.w, tx) && near(p.y, r.y, ty)) mode = 'tr';
  else if (near(p.x, r.x, tx) && near(p.y, r.y + r.h, ty)) mode = 'bl';
  else if (near(p.x, r.x + r.w, tx) && near(p.y, r.y + r.h, ty)) mode = 'br';
  else if (p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h) mode = 'move';
  if (!mode) return;
  E.drag = { mode, p, r: Object.assign({}, r) };
  $('cv').setPointerCapture(e.pointerId); e.preventDefault();
});
$('cv').addEventListener('pointermove', e => {
  if (!E.drag) return;
  const p = edPt(e), d = E.drag, o = d.r, dx = p.x - d.p.x, dy = p.y - d.p.y, MIN = 0.05;
  const cl = v => Math.max(0, Math.min(1, v));
  let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
  if (d.mode === 'move') {
    E.crop = { x: Math.max(0, Math.min(1 - o.w, o.x + dx)), y: Math.max(0, Math.min(1 - o.h, o.y + dy)), w: o.w, h: o.h };
  } else {
    if (d.mode[1] === 'l') x1 = Math.min(cl(o.x + dx), x2 - MIN); else x2 = Math.max(cl(x2 + dx), x1 + MIN);
    if (d.mode[0] === 't') y1 = Math.min(cl(o.y + dy), y2 - MIN); else y2 = Math.max(cl(y2 + dy), y1 + MIN);
    E.crop = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }
  drawEd();
});
['pointerup', 'pointercancel'].forEach(t => $('cv').addEventListener(t, () => (E.drag = null)));
$('edL').onclick = () => { E.rot = (E.rot + 270) % 360; E.crop = { x: 0, y: 0, w: 1, h: 1 }; drawEd(); };
$('edR').onclick = () => { E.rot = (E.rot + 90) % 360; E.crop = { x: 0, y: 0, w: 1, h: 1 }; drawEd(); };
$('edReset').onclick = () => { E.rot = 0; E.crop = { x: 0, y: 0, w: 1, h: 1 }; drawEd(); };
$('edCancel').onclick = () => $('ed').classList.remove('on');
window.addEventListener('resize', () => { if ($('ed').classList.contains('on')) drawEd(); });
$('edSave').onclick = async () => {
  if (E.rot === 0 && E.crop.w === 1 && E.crop.h === 1) { $('ed').classList.remove('on'); return; }
  busy(true);
  try {
    const [W, H] = edDims();
    const full = document.createElement('canvas'); full.width = W; full.height = H;
    drawRotated(full.getContext('2d'), W, H);
    const sx = Math.round(E.crop.x * W), sy = Math.round(E.crop.y * H), sw = Math.round(E.crop.w * W), sh = Math.round(E.crop.h * H);
    const out = document.createElement('canvas'); out.width = sw; out.height = sh;
    out.getContext('2d').drawImage(full, sx, sy, sw, sh, 0, 0, sw, sh);
    const r = await api('replace', { id: E.f.id, data: await canvasToB64(out), edited: true }, 120000);
    $('ed').classList.remove('on');
    toast('✓ 편집 저장: ' + esc(r.name));
    await loadFiles(true);
  } catch (e) { toast('✗ 편집 저장 실패: ' + esc(e.message), 'bad'); }
  busy(false);
};

/* ---------- 접속 / 설정 ---------- */
function logout(msg) {
  S.code = ''; S.name = ''; LS.del('code'); LS.del('name');
  $('who').textContent = ''; $('btnSet').hidden = true;
  $('loginMsg').textContent = msg || '';
  closeModal(true); vwClose();
  show('vLogin');
}
$('btnLogin').onclick = async () => {
  if (!API_URL) S.api = $('inApi').value.trim();
  S.code = $('inCode').value.trim().toUpperCase();
  $('loginMsg').textContent = '';
  if (!S.api || !S.code) { $('loginMsg').textContent = '서버 주소와 접속코드를 입력하세요.'; return; }
  busy(true);
  try {
    const r = await api('auth', {});
    S.name = r.name; LS.set('api', S.api); LS.set('code', S.code); LS.set('name', S.name);
    busy(false);
    start();
  } catch (e) { busy(false); $('loginMsg').textContent = e instanceof NetError ? '서버에 연결하지 못했습니다. 주소와 인터넷을 확인하세요.' : e.message; }
};
$('btnSet').onclick = () => {
  openPanel(`<h2>설정</h2><p>근무자: <b>${esc(S.name)}</b></p><p style="font-size:12px;word-break:break-all;color:var(--sub)">서버: ${esc(S.api)}</p>
    <button class="btn" id="sQ">업로드 대기목록</button><button class="btn" id="sBin">제거함</button><button class="btn danger" id="sOut">접속 해제 (코드 다시 입력)</button>
    <button class="btn sm" data-close>닫기</button><div class="ver">버전 ${VERSION}</div>`);
  $('sQ').onclick = () => { closeModal(); openQueue(); };
  $('sBin').onclick = () => openBin();
  $('sOut').onclick = async () => {
    const n = (await DB.all('q')).length;
    closeModal();
    if (n && !(await ask({ title: '접속 해제', html: `<p>업로드하지 않은 사진 ${n}장은 폰에 남아 있고, 다시 접속하면 업로드할 수 있습니다.</p>`, buttons: [{ label: '취소', value: false }, { label: '접속 해제', value: true, cls: 'danger' }] }))) return;
    logout();
  };
};
function start() {
  $('who').textContent = S.name; $('btnSet').hidden = false;
  $('inJibun').value = ''; $('inLoc').value = '';
  S.committed = ''; S.needShotConfirm = false;
  renderPreview();
  show('vMain'); updateBar();
  startupNotice();
}

/* ---------- 휴대폰 뒤로가기 버튼 ----------
 * 열린 창(확인창·키패드·전체화면·편집기)이 있으면 하나씩 닫고, 하위 화면이면 이전 화면으로,
 * 첫 화면이면 '앱을 종료하시겠습니까?'를 묻는다. 방문 기록에 표시용 항목을 하나 두어 뒤로가기를 가로챈다. */
const NAV = { exiting: false };
function pushGuard() {
  if (NAV.exiting) return;
  if (!(history.state && history.state.sh1)) history.pushState({ sh1: 1 }, '');
}
// 휴대폰 브라우저는 손가락을 '뗄 때' 사용자 동작으로 인정한다. 그 전에 넣으면 뒤로가기 때 무시되므로 떼는 시점·클릭 시점에 넣는다
['click', 'pointerup', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, pushGuard, true));
window.addEventListener('popstate', async () => {
  if (NAV.exiting) return;
  const inline = document.querySelector('.modal.inl');
  if (inline) { inline.querySelector('[data-v="0"]').click(); return pushGuard(); }
  if ($('busy').classList.contains('on')) return pushGuard();
  if ($('ed').classList.contains('on')) { $('ed').classList.remove('on'); return pushGuard(); }
  if ($('vw').classList.contains('on')) { vwClose(); return pushGuard(); }
  if (modalOpen()) {
    if (NAV.exitOpen) return;                     // 종료 확인창이 떠 있을 때 한 번 더 누르면 그대로 종료
    if ($('padCancel')) $('padCancel').click(); else closeModal();
    return pushGuard();
  }
  if (curView === 'vImport') { $('impCancel').click(); return pushGuard(); }
  if (curView === 'vQueue' || curView === 'vFiles') { document.querySelector('#' + curView + ' [data-back]').click(); return pushGuard(); }
  // 첫 화면: 종료 확인 (이때는 표시용 항목이 없으므로 뒤로가기를 한 번 더 누르면 바로 종료)
  let n = 0;
  try { n = (await DB.all('q')).length; } catch (e) {}
  NAV.exitOpen = true;
  const r = await ask({ title: '앱 종료', html: '<p style="font-size:18px;font-weight:700;text-align:center;margin:12px 0">앱을 종료하시겠습니까?</p>' +
    (n ? `<p class="note w">⚠ 업로드하지 않은 사진이 <b>${n}장</b> 있습니다. 사진은 폰에 남아 있고 다음에 앱을 열면 업로드할 수 있습니다.</p>` : '') +
    '<p class="note">뒤로가기 버튼을 한 번 더 눌러도 종료됩니다.</p>',
    buttons: [{ label: '취소', value: false }, { label: '종료', value: true, cls: 'primary' }] });
  NAV.exitOpen = false;
  if (r === true) {
    NAV.exiting = true;
    try { window.close(); } catch (e) {}
    history.back();
    setTimeout(() => { NAV.exiting = false; toast('뒤로가기 버튼을 한 번 더 누르면 종료됩니다'); }, 500);
  } else pushGuard();
});

/* ---------- 시작 ---------- */
(async function init() {
  if (API_URL) $('apiWrap').style.display = 'none'; else $('inApi').value = S.api;
  $('onlyLoc').checked = LS.get('onlyLoc', false);
  setGubun(S.gubun, true);
  try { await purgeBin(); } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // 새 버전이 올라오면 자동으로 받아서 한 번 새로고침 (작업 중 입력값·대기목록은 폰에 그대로 남음)
    const hadCtl = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadCtl || reloaded) return;
      if (modalOpen() || $('busy').classList.contains('on') || curView === 'vImport') return;   // 작업 중이면 다음 실행 때 적용
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
  if (S.code && S.api) start(); else show('vLogin');
})();
</script>
